name: go
on:
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
          working-directory: vs-status-updater
      - name: Vet
        working-directory: vs-status-updater
        run: go vet ./...
      - name: Build
        working-directory: vs-status-updater
        run: go build ./...
